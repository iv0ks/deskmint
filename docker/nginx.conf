# Deskmint nginx site config.
# Serves the static files in /app/public and forwards *.php to php-fpm.
server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;

    # Static assets (css, svg favicon, ...) are served directly by nginx.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hand PHP scripts to the php-fpm container over the shared network.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass deskmint-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Lightweight health endpoint for the container HEALTHCHECK.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }
}
